# Serveur web du journal : fichiers statiques uniquement, derrière un mot de passe partagé.
# Tailscale Funnel (ou tout autre tunnel) ne doit pointer QUE sur ce port, jamais sur Home Assistant.
server {
    listen 8080;
    server_name _;
    root /data/out;
    index index.html;

    auth_basic "Journal de famille";
    auth_basic_user_file /data/htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ { expires 1d; }
    location /media/  { expires 7d; add_header Cache-Control "private"; }
    location /        { try_files $uri $uri/ =404; }
}
